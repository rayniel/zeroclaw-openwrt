name: Build ZeroClaw for OpenWrt IPQ4019

on:
  workflow_dispatch:
    inputs:
      extra_features:
        description: "Optional Cargo features, comma-separated (e.g. channel-telegram)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXTRA_FEATURES: ${{ inputs.extra_features }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          xargs -a scripts/runner-packages.txt sudo apt-get install -y --no-install-recommends
      - name: Check deployment scripts
        run: |
          bash -n scripts/build.sh
          sh -n scripts/install.sh
          shellcheck -S warning -s sh -e SC1091,SC2034,SC3043 \
            scripts/install.sh openwrt/files/zeroclaw \
            openwrt/files/zeroclaw.init openwrt/files/zeroclaw-common.sh \
            tests/storage.sh
          sh tests/storage.sh
      - name: Cross-compile, smoke-test, and package
        run: bash scripts/build.sh
      - name: Upload packages and build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroclaw-openwrt-ipq4019-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS
            dist/*-info.txt
          if-no-files-found: warn
          retention-days: 14
