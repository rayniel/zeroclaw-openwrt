name: Build ZeroClaw for OpenWrt IPQ4019

on:
  workflow_dispatch:
    inputs:
      extra_features:
        description: "Optional Cargo features, comma-separated (e.g. channel-telegram)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXTRA_FEATURES: ${{ inputs.extra_features }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          xargs -a scripts/runner-packages.txt sudo apt-get install -y --no-install-recommends
      - name: Check deployment scripts
        run: |
          bash -n scripts/build.sh
          sh -n scripts/install.sh
          sh -n scripts/run-test.sh
          sh -n scripts/prepare-state-image.sh
          shellcheck -S warning -s sh -e SC1091,SC2034,SC3043 \
            scripts/install.sh scripts/run-test.sh scripts/prepare-state-image.sh openwrt/files/zeroclaw \
            openwrt/files/zeroclaw.init openwrt/files/zeroclaw-common.sh \
            tests/storage.sh tests/run-test.sh tests/image-storage.sh tests/image-mount.sh
          sh tests/storage.sh
          sh tests/run-test.sh
          sh tests/image-storage.sh
      - name: Restore Cargo build cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ipq4019-${{ runner.os }}-${{ hashFiles('build.env', 'scripts/build.sh') }}-${{ inputs.extra_features }}
          restore-keys: |
            ipq4019-${{ runner.os }}-${{ hashFiles('build.env', 'scripts/build.sh') }}-
            ipq4019-${{ runner.os }}-
      - name: Cross-compile, smoke-test, and package
        run: bash scripts/build.sh
      - name: Upload packages and build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroclaw-openwrt-ipq4019-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS
            dist/*-info.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Save Cargo build cache
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
